# Cucumber + JUnit 5 Platform configuration for the Online Shopping Cart assignment.

# Console output ("pretty") plus a standalone HTML report.
cucumber.plugin=pretty, html:target/cucumber-report.html

# Where the step definitions and hooks live.
cucumber.glue=steps

# Where the .feature files live.
# NOTE: The feature location is provided by @SelectClasspathResource("features")
# in runner.RunCucumberTest. Setting cucumber.features as well makes the
# Cucumber engine discover the features twice (16 executions instead of 8).
# With the JUnit 5 Suite Engine you should NOT set this property, so it is
# intentionally left commented out.
# cucumber.features=src/test/resources/features
